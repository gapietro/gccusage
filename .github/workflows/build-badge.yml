name: build badge

# Stamps README.md with MMDD.<pushes to main today>.
#
# The commit this job makes is itself a push to main, so it looks recursive.
# It is not: a push authenticated with GITHUB_TOKEN does not create a workflow
# run, which is GitHub's own recursion guard and needs nothing from us. The
# `if` below is the belt to that brace, keyed on the actor.
#
# This deliberately does NOT use "[skip ci]" in the bot's commit message. That
# was the first design and it was wrong in a way worth recording: GitHub's
# native skip matches the phrase anywhere in a commit message, including prose,
# so the merge commit that introduced this workflow — which merely *described*
# the mechanism — skipped its own first run and stamped nothing. A guard that
# any commit message can trip by talking about it is not a guard.
#
# One consequence survives and cannot be fixed here: a human commit whose
# message contains the literal phrase is skipped by GitHub before this workflow
# is consulted, and that push goes uncounted.
on:
  push:
    branches: [main]

permissions:
  contents: write

# There is deliberately no `concurrency` group. It looks like the right tool
# for "don't let two runs read the same count", but it cannot be: a run reads
# the repository at checkout, and serialising *execution* does not refresh a
# snapshot taken from the triggering commit. Worse, GitHub cancels a run that
# is already pending when a newer one queues behind an in-progress run —
# `cancel-in-progress: false` only protects runs that have started — so a burst
# of pushes would silently lose counts to the very mechanism meant to protect
# them. Correctness comes from the retry loop below instead, which re-reads the
# branch tip on every attempt and lets a rejected push, not a queue, serialise
# the runs.

jobs:
  stamp:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      # Full history, and the branch rather than the triggering commit: this
      # job must count from the tip that other runs have already stamped.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # The script is a .ts file run directly by Node, so this must be a
      # version with native type stripping (23.6+, or 22.x backported).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Stamp and commit the new build number
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Every attempt recomputes from a freshly fetched tip. Resetting
          # first is what makes a retry correct rather than just repeated: a
          # rejected push means someone else's badge commit landed, so the
          # count this attempt computed is already stale and must be thrown
          # away, not rebased forward.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            node scripts/build-badge.ts

            if git diff --quiet; then
              echo "nothing to stamp"
              exit 0
            fi

            build=$(node -p "require('./.github/build-number.json').build")
            git add README.md .github/build-number.json
            git commit -m "chore: build ${build}"

            if git push; then
              echo "stamped ${build} on attempt ${attempt}"
              exit 0
            fi

            echo "push rejected on attempt ${attempt}; another run landed first"
          done

          echo "could not stamp after 5 attempts"
          exit 1
