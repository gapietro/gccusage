name: ci

# Runs the suite that was previously advisory, and enforces this project's
# hardest-won invariant: dist/index.js is rebuilt and staged in the same commit
# as any src/ change. `gccusage setup` points statusLine.command at that file,
# so a src-only commit leaves everyone who upgrades via `git pull` running the
# old code. That has already shipped once (PR #38 landed three commits without
# the bundle, and the fix reached nobody until final review).
on:
  pull_request:
  push:
    branches: [main]

# This workflow only reads. build-badge.yml needs contents: write because it
# commits; nothing here does.
permissions:
  contents: read

# Superseding a run is correct here and would NOT be in build-badge.yml. That
# workflow reads a shared, mutating value (the branch tip) and explains at
# length why serialising it by queue loses counts. CI reads only the commit it
# was triggered for, so an obsoleted run has nothing to preserve.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel 24 because 22 failed; knowing whether a break is
      # version-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        # 22 is the floor the whole project claims: package.json engines,
        # devEngines and tsdown's target all say 22, and scripts/ are .ts
        # files Node runs directly, needing native type stripping (22.18+).
        node: ["22", "24"]
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Note that this also runs `prepare`, i.e. `npm run build`. The suite
      # depends on that: statusline-width.test.ts execs dist/index.js as a real
      # child process to catch what vitest's resolver would paper over.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run typecheck:scripts

      - run: npm test

  lint:
    runs-on: ubuntu-latest
    # Asks a question the other jobs cannot: not "does it work" but "is it
    # written the way this project writes things". Runs once and on one Node
    # version — oxlint is a self-contained Rust binary, so its verdict cannot
    # vary by runtime the way the test matrix's can.
    #
    # `--report-unused-disable-directives-severity=error` is the part worth
    # keeping. #98 was opened because a suppression comment outlived the rule
    # it suppressed; as an error rather than the default warning, that exact
    # decay now fails the build instead of accumulating quietly.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      # No build needed: oxlint reads source, never dist/. `--ignore-scripts`
      # skips `prepare`, so this job stays a few seconds rather than paying for
      # a bundle it will not look at.
      - run: npm ci --ignore-scripts

      - run: npm run lint

  coverage:
    runs-on: ubuntu-latest
    # Separate from the matrix on purpose. `npm test` above is the honest
    # signal that the code works, on both supported runtimes, uninstrumented.
    # This job asks a different question — is any single file unmeasured — and
    # the answer does not vary by Node version, so it runs once.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      # `prepare` builds dist/index.js during this, which the suite needs:
      # the concurrency and CLI tests spawn the shipped bundle as a real child
      # process rather than importing src.
      - run: npm ci

      # Fails when any file on the production path drops below 70% statements.
      # The bar is per-file, not global: coverage was 87.78% overall when the
      # audit ran and every correctness defect it found still lived in a file
      # at 0-46%, which a global average had comfortably hidden (#95).
      - run: npm run coverage

  bundle-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Idempotent — `prepare` already built during `npm ci`. Kept explicit so
      # the ordering is legible: the diff below is only meaningful *after* an
      # install, never before, because npm has already rewritten the file by
      # then.
      - run: npm run build

      - name: Committed bundle matches a fresh build
        run: |
          if ! git diff --exit-code -- dist/index.js; then
            echo "::error file=dist/index.js::dist/index.js is stale. Run 'npm run build' and 'git add -f dist/index.js'."
            exit 1
          fi
